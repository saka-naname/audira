[tools]
node = "24.18.0"
rust = "1.95.0"

[tasks.dev]
run = "npm run tauri dev"

[tasks."check:frontend"]
alias = "lint:frontend"
run = "npm run check"

[tasks."check:frontend-type"]
run = "npm run type-check"

[tasks."check:backend"]
alias = "lint:backend"
run = "cargo check --manifest-path src-tauri/Cargo.toml"

[tasks.check]
alias = "lint"
run = [{ tasks = ["check:*"] }]

[tasks."test:frontend"]
run = "npm run test"

[tasks."test:backend"]
run = "cargo test --manifest-path src-tauri/Cargo.toml"

[tasks.test]
run = [{ tasks = ["test:*"] }]

[tasks.database-path]
run = "cargo run --quiet --manifest-path src-tauri/Cargo.toml --bin audira-db-path"
